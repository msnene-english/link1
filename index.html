  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }

<script>
// Web Audio API
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(frequency, duration, type, volume) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playSelectSound() {
  playTone(600, 0.08, 'sine', 0.15);
}

function playCorrectSound() {
  playTone(800, 0.1, 'sine', 0.2);
  setTimeout(() => playTone(1200, 0.15, 'sine', 0.2), 100);
}

function playWrongSound() {
  playTone(150, 0.2, 'sawtooth', 0.12);
}

let submitted = false;

function initQuiz() {
  const container = document.getElementById('quiz-container');
  quizData.forEach(q => {
    userState[q.id] = { selected: null, checked: false, isCorrect: null };
    
    // Shuffle options array for display
    let dispOptions = q.options.map(o => ({...o, originalLabel: o.label}));
    dispOptions.sort(() => 0);
    
    // Shuffle labels A,B,C,D
    let labels = ['A', 'B', 'C', 'D'];
    labels.sort(() => 0);
    dispOptions.forEach((o, i) => o.displayLabel = labels[i]);
    
    let sectionHtml = '';
    if (q.section) {
      sectionHtml = `<div class="section-title">${q.section}</div>`;
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${q.id}`;
    
    let html = `${sectionHtml}
      <div class="question-text">${q.questionHTML}</div>
      <div class="options">`;
    
    dispOptions.forEach(opt => {
      html += `<button class="option-btn" id="btn-${q.id}-${opt.originalLabel}" onclick="selectOption(${q.id}, '${opt.originalLabel}')">
        ${opt.displayLabel}. ${opt.html}
      </button>`;
    });

    html += `</div>
      <button class="check-btn" id="check-${q.id}" onclick="checkAnswer(${q.id})" disabled>Kiểm tra</button>
      <div style="clear:both;"></div>
      <div class="explanation" id="exp-${q.id}">${q.explanationHTML}</div>`;
    
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function selectOption(qId, origLabel) {
  if (userState[qId].checked) return;
  
  userState[qId].selected = origLabel;
  playSelectSound();
  
  // Reset all buttons in this question
  const card = document.getElementById(`card-${qId}`);
  const btns = card.querySelectorAll('.option-btn');
  btns.forEach(b => b.classList.remove('pending'));
  
  // Highlight selected
  document.getElementById(`btn-${qId}-${origLabel}`).classList.add('pending');
  document.getElementById(`check-${qId}`).disabled = false;
  
  updateProgress();
}

function checkAnswer(qId, auto = false) {
  if (userState[qId].checked || userState[qId].selected === null) return;
  
  const q = quizData.find(x => x.id === qId);
  const correctOpt = q.options.find(x => x.isCorrect);
  
  userState[qId].isCorrect = (userState[qId].selected === correctOpt.label);
  userState[qId].checked = true;
  
  const card = document.getElementById(`card-${qId}`);
  const btns = card.querySelectorAll('.option-btn');
  
  btns.forEach(b => {
    b.classList.remove('pending');
    b.disabled = true;
  });
  
  // Correct green
  document.getElementById(`btn-${qId}-${correctOpt.label}`).classList.add('correct');
  
  if (!userState[qId].isCorrect) {
    document.getElementById(`btn-${qId}-${userState[qId].selected}`).classList.add('wrong');
    if (!auto) playWrongSound();
  } else {
    if (!auto) playCorrectSound();
  }
  
  document.getElementById(`check-${qId}`).disabled = true;
  document.getElementById(`check-${qId}`).style.display = 'none';
  document.getElementById(`exp-${qId}`).style.display = 'block';
  
  updateProgress();
}

function updateProgress() {
  const total = quizData.length;
  const answered = Object.values(userState).filter(s => s.selected !== null).length;
  document.getElementById('progress-fill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progress-text').innerText = `Đã chọn: ${answered}/${total}`;
}

function submitQuiz() {
  if (submitted) return;
  
  const studentName = document.getElementById('student-name').value.trim();
  if (!studentName) {
    alert("Vui lòng nhập tên trước khi nộp bài!");
    return;
  }
  
  submitted = true;
  document.getElementById('submit-btn').disabled = true;
  
  let correctCount = 0;
  let wrongDetails = [];
  
  quizData.forEach(q => {
    if (!userState[q.id].checked) {
      if (userState[q.id].selected !== null) {
        checkAnswer(q.id, true);
      } else {
        userState[q.id].checked = true;
        userState[q.id].isCorrect = false;
        
        const correctOpt = q.options.find(x => x.isCorrect);
        const card = document.getElementById(`card-${q.id}`);
        const btns = card.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);
        document.getElementById(`btn-${q.id}-${correctOpt.label}`).classList.add('correct');
        document.getElementById(`check-${q.id}`).disabled = true;
        document.getElementById(`check-${q.id}`).style.display = 'none';
        document.getElementById(`exp-${q.id}`).style.display = 'block';
      }
    }
    
    if (userState[q.id].isCorrect) correctCount++;
    else {
      let sel = userState[q.id].selected || "Bỏ trống";
      wrongDetails.push(`Câu ${q.id}: Chọn ${sel}`);
    }
  });
  
  const score = ((correctCount / quizData.length) * 10).toFixed(2);
  const ratio = `${correctCount}/${quizData.length}`;
  
  let message = "";
  if (correctCount === quizData.length) message = "Tuyệt vời! Bạn đạt điểm tuyệt đối!";
  else if (correctCount >= quizData.length * 0.8) message = "Rất tốt! Cố gắng duy trì nhé!";
  else if (correctCount >= quizData.length * 0.5) message = "Khá tốt, nhưng bạn cần ôn tập thêm một chút!";
  else message = "Cố gắng hơn ở lần sau nhé!";
  
  document.getElementById('popup-score').innerText = `Điểm của bạn: ${score} (${ratio})`;
  document.getElementById('popup-message').innerText = message;
  document.getElementById('popup-overlay').style.display = 'flex';
  
  renderSummaryTable(correctCount === quizData.length);
  
  // Submit to Google Form
  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSelQyzh_lWyb2vZUnQ1jc1p9FLRknDZiUt9NiUiiX1epHTFLw/formResponse";
  const formBody = new URLSearchParams({
    "entry.351633352": "link1",
    "entry.1895948982": studentName,
    "entry.1232319784": score,
    "entry.1125920425": ratio,
    "entry.1907417670": wrongDetails.join(' | ') || "Không có"
  });
  
  fetch(formUrl, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: formBody.toString()
  }).catch(e => console.log(e));
}

function closePopup() {
  document.getElementById('popup-overlay').style.display = 'none';
  document.getElementById('summary-container').scrollIntoView({ behavior: 'smooth' });
}

function renderSummaryTable(isPerfect) {
  const container = document.getElementById('summary-container');
  const tablesDiv = document.getElementById('summary-tables');
  container.style.display = 'block';
  
  if (isPerfect) {
    document.getElementById('summary-title').innerText = "Bảng Tổng Kết - Chúc mừng bạn đã đạt điểm tuyệt đối!";
  }
  
  let html = '';
  const cols = 15;
  for (let i = 0; i < quizData.length; i += cols) {
    const chunk = quizData.slice(i, i + cols);
    html += '<table class="summary-table" style="margin-bottom: 20px;"><tr><th>Câu</th>';
    
    chunk.forEach(q => html += `<th>${q.id}</th>`);
    html += '</tr>';
    
    ['A', 'B', 'C', 'D'].forEach(label => {
      html += `<tr><th>${label}</th>`;
      chunk.forEach(q => {
        const state = userState[q.id];
        const isCorrectOpt = q.options.find(x => x.isCorrect).label === label;
        
        let cellClass = "";
        if (state.selected === null) {
          cellClass = "empty-col";
        } else if (isCorrectOpt) {
          cellClass = "correct-cell";
        } else if (state.selected === label && !state.isCorrect) {
          cellClass = "wrong-cell";
        }
        
        html += `<td class="${cellClass}">${label}</td>`;
      });
      html += '</tr>';
    });
    html += '</table>';
  }
  tablesDiv.innerHTML = html;
}

window.onload = initQuiz;
</script>
