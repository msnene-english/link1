    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        /* Make sure watermark doesn't overlap progress bar */
        .watermark { position: fixed; top: 30px; left: 10px; font-weight: bold; color: rgba(0, 0, 0, 0.3); z-index: 99; pointer-events: none; font-size: 14px; }
        .footer-watermark { text-align: center; padding: 20px; font-weight: bold; color: rgba(0, 0, 0, 0.5); font-size: 14px; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 5px; margin-bottom: 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .progress-bar { height: 10px; background-color: #3498db; border-radius: 5px; width: 0%; transition: width 0.3s; }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; text-align: center; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.3s; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .question-block { margin-bottom: 25px; padding: 15px; background: #f9f9f9; border-left: 4px solid #3498db; border-radius: 4px; }
        .question-text { font-size: 17px; font-weight: 600; margin-bottom: 15px; line-height: 1.6; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
        
        .options label { display: block; margin-bottom: 8px; cursor: pointer; padding: 10px; border-radius: 4px; transition: background 0.2s; border: 1px solid transparent; font-size: 16px; }
        .options label:hover { background: #eef; }
        .options input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
        
        .check-btn { width: auto; padding: 8px 15px; font-size: 14px; margin-top: 15px; display: inline-block; }
        
        .explanation { margin-top: 15px; padding: 15px; background: #e8f4fd; border: 1px solid #b6d4fe; border-radius: 5px; display: none; font-size: 15px; line-height: 1.6; }
        .explanation strong, .explanation b { color: #0056b3; }
        
        .correct-opt { background: #d4edda !important; border-color: #c3e6cb !important; }
        .wrong-opt { background: #f8d7da !important; border-color: #f5c6cb !important; }
        
        /* Gap fill inline */
        .gap-fill-input { width: 120px !important; display: inline-block !important; padding: 5px !important; margin: 0 5px !important; text-align: center; font-weight: bold; color: #2c3e50; font-size: 16px; border-bottom: 2px solid #3498db; background: transparent; }
        .correct-input { border-color: #27ae60 !important; background-color: #d4edda !important; }
        .wrong-input { border-color: #e74c3c !important; background-color: #f8d7da !important; }
        .correct-answer-text { color: #27ae60; font-weight: bold; margin-left: 5px; }
        
        /* Reordering */
        .word-bank, .drop-zone { min-height: 50px; padding: 10px; border: 2px dashed #ccc; border-radius: 5px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; background: #fff; width: 100%; }
        .drop-zone { border-color: #3498db; background: #f0f8ff; }
        .word-chip { padding: 8px 15px; background-color: #3498db; color: white; border-radius: 20px; cursor: pointer; user-select: none; font-size: 16px; transition: transform 0.1s, background 0.2s; display: inline-block; }
        .word-chip:hover { background-color: #2980b9; transform: scale(1.05); }
        
        .submit-btn { background-color: #27ae60; font-size: 18px; padding: 15px; margin-top: 30px; }
        .submit-btn:hover { background-color: #219653; }
        
        .result-score { font-size: 28px; text-align: center; font-weight: bold; color: #27ae60; margin: 30px 0; }
        
        /* Sentence rewrite */
        textarea.rewrite-input { width: 100%; height: 60px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; font-family: inherit; resize: vertical; margin-top: 10px; }

    <script>
        const quizData = [{"id": 1, "type": "multiple_choice", "questionHTML": "Elizabeth <b>usually goes / is usually going</b> to bed at around eleven o'clock.", "options": [{"label": "A", "html": "usually goes", "isCorrect": true}, {"label": "B", "html": "is usually going", "isCorrect": false}], "explanationHTML": "D\u1ecbch: Elizabeth th\u01b0\u1eddng \u0111i ng\u1ee7 v\u00e0o kho\u1ea3ng 11 gi\u1edd.<br>Gi\u1ea3i th\u00edch: 'usually' l\u00e0 d\u1ea5u hi\u1ec7u c\u1ee7a th\u00ec hi\u1ec7n t\u1ea1i \u0111\u01a1n di\u1ec5n t\u1ea3 m\u1ed9t th\u00f3i quen (habit). Do \u0111\u00f3, \u0111\u00e1p \u00e1n \u0111\u00fang l\u00e0 <b>usually goes</b>. 'is usually going' sai v\u00ec d\u00f9ng th\u00ec hi\u1ec7n t\u1ea1i ti\u1ebfp di\u1ec5n cho th\u00f3i quen th\u01b0\u1eddng xuy\u00ean."}, {"id": 2, "type": "multiple_choice", "questionHTML": "Dan <b>talks / is talking</b> on the other phone right now.", "options": [{"label": "A", "html": "talks", "isCorrect": false}, {"label": "B", "html": "is talking", "isCorrect": true}], "explanationHTML": "D\u1ecbch: Dan \u0111ang n\u00f3i chuy\u1ec7n tr\u00ean m\u1ed9t chi\u1ebfc \u0111i\u1ec7n tho\u1ea1i kh\u00e1c ngay l\u00fac n\u00e0y.<br>Gi\u1ea3i th\u00edch: 'right now' l\u00e0 d\u1ea5u hi\u1ec7u c\u1ee7a th\u00ec hi\u1ec7n t\u1ea1i ti\u1ebfp di\u1ec5n ch\u1ec9 m\u1ed9t h\u00e0nh \u0111\u1ed9ng \u0111ang x\u1ea3y ra t\u1ea1i th\u1eddi \u0111i\u1ec3m n\u00f3i. Do \u0111\u00f3, <b>is talking</b> l\u00e0 \u0111\u00fang."}, {"id": 3, "type": "multiple_choice", "questionHTML": "We <b>don't eat / aren't eating</b> any meat at the moment as we're both on a diet.", "options": [{"label": "A", "html": "don't eat", "isCorrect": false}, {"label": "B", "html": "aren't eating", "isCorrect": true}], "explanationHTML": "D\u1ecbch: Ch\u00fang t\u00f4i kh\u00f4ng \u0103n th\u1ecbt v\u00e0o l\u00fac n\u00e0y v\u00ec c\u1ea3 hai \u0111ang \u0103n ki\u00eang.<br>Gi\u1ea3i th\u00edch: 'at the moment' l\u00e0 d\u1ea5u hi\u1ec7u c\u1ee7a th\u00ec hi\u1ec7n t\u1ea1i ti\u1ebfp di\u1ec5n ch\u1ec9 m\u1ed9t s\u1ef1 vi\u1ec7c \u0111ang di\u1ec5n ra t\u1ea1m th\u1eddi xung quanh th\u1eddi \u0111i\u1ec3m hi\u1ec7n t\u1ea1i. V\u1eady <b>aren't eating</b> l\u00e0 \u0111\u00fang."}, {"id": 4, "type": "multiple_choice", "questionHTML": "<b>Does air travel get / Is air travel getting</b> increasingly safe?", "options": [{"label": "A", "html": "Does air travel get", "isCorrect": false}, {"label": "B", "html": "Is air travel getting", "isCorrect": true}], "explanationHTML": "D\u1ecbch: \u0110i l\u1ea1i b\u1eb1ng \u0111\u01b0\u1eddng h\u00e0ng kh\u00f4ng c\u00f3 \u0111ang tr\u1edf n\u00ean ng\u00e0y c\u00e0ng an to\u00e0n h\u01a1n kh\u00f4ng?<br>Gi\u1ea3i th\u00edch: 'increasingly' ch\u1ec9 m\u1ed9t s\u1ef1 thay \u0111\u1ed5i \u0111ang di\u1ec5n ra (changing situations). Ta d\u00f9ng th\u00ec hi\u1ec7n t\u1ea1i ti\u1ebfp di\u1ec5n. Do \u0111\u00f3 <b>Is air travel getting</b> \u0111\u00fang."}, {"id": 5, "type": "multiple_choice", "questionHTML": "My mum <b>calls / is calling</b> me every weekend without fail.", "options": [{"label": "A", "html": "calls", "isCorrect": true}, {"label": "B", "html": "is calling", "isCorrect": false}], "explanationHTML": "D\u1ecbch: M\u1eb9 t\u00f4i g\u1ecdi t\u00f4i m\u1ed7i cu\u1ed1i tu\u1ea7n m\u00e0 kh\u00f4ng bao gi\u1edd qu\u00ean.<br>Gi\u1ea3i th\u00edch: 'every weekend' di\u1ec5n t\u1ea3 m\u1ed9t th\u00f3i quen l\u1eb7p \u0111i l\u1eb7p l\u1ea1i. Ta d\u00f9ng th\u00ec hi\u1ec7n t\u1ea1i \u0111\u01a1n: <b>calls</b>."}, {"id": 6, "type": "multiple_choice", "questionHTML": "How much <b>do babysitters generally earn / are babysitters generally earning</b>?", "options": [{"label": "A", "html": "do babysitters generally earn", "isCorrect": true}, {"label": "B", "html": "are babysitters generally earning", "isCorrect": false}], "explanationHTML": "D\u1ecbch: Nh\u1eefng ng\u01b0\u1eddi tr\u00f4ng tr\u1ebb th\u01b0\u1eddng ki\u1ebfm \u0111\u01b0\u1ee3c bao nhi\u00eau ti\u1ec1n?<br>Gi\u1ea3i th\u00edch: 'generally' (nh\u00ecn chung, th\u01b0\u1eddng th\u01b0\u1eddng) l\u00e0 d\u1ea5u hi\u1ec7u c\u1ee7a hi\u1ec7n t\u1ea1i \u0111\u01a1n, ch\u1ec9 m\u1ed9t s\u1ef1 th\u1eadt hi\u1ec3n nhi\u00ean ho\u1eb7c t\u00ecnh tr\u1ea1ng chung. Do \u0111\u00f3 <b>do babysitters generally earn</b> \u0111\u00fang."}, {"id": 7, "type": "multiple_choice", "questionHTML": "<b>You always come / You're always coming</b> up with excuses for not having done your homework. It's so annoying!", "options": [{"label": "A", "html": "You always come", "isCorrect": false}, {"label": "B", "html": "You're always coming", "isCorrect": true}], "explanationHTML": "D\u1ecbch: B\u1ea1n l\u00fac n\u00e0o c\u0169ng b\u1ecba ra l\u00fd do cho vi\u1ec7c kh\u00f4ng l\u00e0m b\u00e0i t\u1eadp. Th\u1eadt kh\u00f3 ch\u1ecbu!<br>Gi\u1ea3i th\u00edch: C\u1ea5u tr\u00fac <i>always + V-ing (hi\u1ec7n t\u1ea1i ti\u1ebfp di\u1ec5n)</i> di\u1ec5n t\u1ea3 s\u1ef1 ph\u00e0n n\u00e0n v\u1ec1 m\u1ed9t vi\u1ec7c l\u1eb7p \u0111i l\u1eb7p l\u1ea1i g\u00e2y b\u1ef1c m\u00ecnh. <b>You're always coming</b> \u0111\u00fang."}, {"id": 8, "type": "multiple_choice", "questionHTML": "<b>I don't go / I'm not going</b> out much during the week but <b>I always try / I'm always trying</b> to go out somewhere on Saturday night.", "options": [{"label": "A", "html": "I don't go / I always try", "isCorrect": true}, {"label": "B", "html": "I'm not going / I'm always trying", "isCorrect": false}, {"label": "C", "html": "I don't go / I'm always trying", "isCorrect": false}, {"label": "D", "html": "I'm not going / I always try", "isCorrect": false}], "explanationHTML": "D\u1ecbch: T\u00f4i th\u01b0\u1eddng kh\u00f4ng \u0111i ra ngo\u00e0i nhi\u1ec1u trong tu\u1ea7n nh\u01b0ng t\u00f4i lu\u00f4n c\u1ed1 g\u1eafng \u0111i \u0111\u00e2u \u0111\u00f3 v\u00e0o t\u1ed1i th\u1ee9 B\u1ea3y.<br>Gi\u1ea3i th\u00edch: C\u1ea3 2 v\u1ebf \u0111\u1ec1u n\u00f3i v\u1ec1 m\u1ed9t th\u00f3i quen chung chung, kh\u00f4ng ph\u1ea3i t\u1ea1m th\u1eddi hay ph\u00e0n n\u00e0n, do \u0111\u00f3 ta d\u00f9ng hi\u1ec7n t\u1ea1i \u0111\u01a1n cho c\u1ea3 hai: <b>don't go / always try</b>."}, {"id": 9, "type": "multiple_choice", "questionHTML": "No, the train <b>does stop / is stopping</b> at Cirencester on Saturdays.", "options": [{"label": "A", "html": "does stop", "isCorrect": true}, {"label": "B", "html": "is stopping", "isCorrect": false}], "explanationHTML": "D\u1ecbch: Kh\u00f4ng, t\u00e0u c\u00f3 d\u1eebng \u1edf Cirencester v\u00e0o c\u00e1c ng\u00e0y th\u1ee9 B\u1ea3y.<br>Gi\u1ea3i th\u00edch: 'on Saturdays' ch\u1ec9 l\u1ecbch tr\u00ecnh l\u1eb7p l\u1ea1i c\u1ed1 \u0111\u1ecbnh. D\u00f9ng th\u00ec hi\u1ec7n t\u1ea1i \u0111\u01a1n. \u1ede \u0111\u00e2y 'does stop' \u0111\u01b0\u1ee3c d\u00f9ng \u0111\u1ec3 nh\u1ea5n m\u1ea1nh kh\u1eb3ng \u0111\u1ecbnh (d\u00f9ng tr\u1ee3 \u0111\u1ed9ng t\u1eeb do/does + V). <b>does stop</b> \u0111\u00fang."}, {"id": 10, "type": "multiple_choice", "questionHTML": "My mum <b>takes / is taking</b> part in ice-skating competitions almost every weekend.", "options": [{"label": "A", "html": "takes", "isCorrect": true}, {"label": "B", "html": "is taking", "isCorrect": false}], "explanationHTML": "D\u1ecbch: M\u1eb9 t\u00f4i tham gia v\u00e0o c\u00e1c cu\u1ed9c thi tr\u01b0\u1ee3t b\u0103ng g\u1ea7n nh\u01b0 m\u1ed7i cu\u1ed1i tu\u1ea7n.<br>Gi\u1ea3i th\u00edch: 'almost every weekend' ch\u1ec9 m\u1ed9t th\u00f3i quen. D\u00f9ng hi\u1ec7n t\u1ea1i \u0111\u01a1n: <b>takes</b>."}, {"id": 11, "type": "gap_fill_text", "questionHTML": "<b>Rewrite correctly. Change the words or phrases in bold.</b><br>My dad <b>is often getting up</b> late on Saturday mornings.<br>My dad {{blank:b1}} late on Saturday mornings.", "blanks": [{"blankId": "b1", "correctAnswers": ["often gets up", "gets up often"]}], "explanationHTML": "D\u1ecbch: B\u1ed1 t\u00f4i th\u01b0\u1eddng xuy\u00ean d\u1eady mu\u1ed9n v\u00e0o c\u00e1c bu\u1ed5i s\u00e1ng th\u1ee9 B\u1ea3y.<br>Gi\u1ea3i th\u00edch: 'often' v\u00e0 'on Saturday mornings' ch\u1ec9 th\u00f3i quen, c\u1ea7n d\u00f9ng hi\u1ec7n t\u1ea1i \u0111\u01a1n, kh\u00f4ng d\u00f9ng hi\u1ec7n t\u1ea1i ti\u1ebfp di\u1ec5n. Do \u0111\u00f3 'is often getting up' s\u1eeda th\u00e0nh <b>often gets up</b>."}, {"id": 12, "type": "gap_fill_text", "questionHTML": "<b>Are you speaking</b> any other languages apart from English?<br>{{blank:b1}} any other languages apart from English?", "blanks": [{"blankId": "b1", "correctAnswers": ["Do you speak", "do you speak"]}], "explanationHTML": "D\u1ecbch: B\u1ea1n c\u00f3 n\u00f3i ng\u00f4n ng\u1eef n\u00e0o kh\u00e1c ngo\u00e0i ti\u1ebfng Anh kh\u00f4ng?<br>Gi\u1ea3i th\u00edch: H\u1ecfi v\u1ec1 kh\u1ea3 n\u0103ng ng\u00f4n ng\u1eef chung chung, l\u00e0 s\u1ef1 th\u1eadt hi\u1ec3n nhi\u00ean (state), ta d\u00f9ng hi\u1ec7n t\u1ea1i \u0111\u01a1n: <b>Do you speak</b>."}, {"id": 13, "type": "gap_fill_text", "questionHTML": "<b>I already buy</b> all my Christmas presents and it's only October!<br>{{blank:b1}} all my Christmas presents and it's only October!", "blanks": [{"blankId": "b1", "correctAnswers": ["I have already bought", "I've already bought", "I have bought", "I've bought"]}], "explanationHTML": "D\u1ecbch: T\u00f4i \u0111\u00e3 mua xong t\u1ea5t c\u1ea3 qu\u00e0 Gi\u00e1ng sinh v\u00e0 gi\u1edd m\u1edbi ch\u1ec9 l\u00e0 th\u00e1ng 10!<br>Gi\u1ea3i th\u00edch: 'already' (\u0111\u00e3 ... r\u1ed3i) nh\u1ea5n m\u1ea1nh m\u1ed9t h\u00e0nh \u0111\u1ed9ng \u0111\u00e3 ho\u00e0n th\u00e0nh t\u00ednh \u0111\u1ebfn th\u1eddi \u0111i\u1ec3m hi\u1ec7n t\u1ea1i. Ta d\u00f9ng hi\u1ec7n t\u1ea1i ho\u00e0n th\u00e0nh: <b>I have already bought</b> ho\u1eb7c <b>I've already bought</b>."}, {"id": 14, "type": "gap_fill_text", "questionHTML": "It's the first time <b>I'm ever having</b> a party at home.<br>It's the first time {{blank:b1}} a party at home.", "blanks": [{"blankId": "b1", "correctAnswers": ["I have ever had", "I've ever had", "I have had"]}], "explanationHTML": "D\u1ecbch: \u0110\u00e2y l\u00e0 l\u1ea7n \u0                     html += '<div class="reordering-container">';
                    html += '   <div class="drop-zone" id="drop-' + q.id + '"></div>';
                    html += '   <div class="word-bank" id="bank-' + q.id + '">';
                    q.words.forEach(w => {
                        html += '<span class="word-chip" id="chip-' + q.id + '-' + w.tokenId + '" data-token="' + w.tokenId + '" onclick="moveChip(' + q.id + ', \'' + w.tokenId + '\')">' + w.text + '</span>';
                    });
                    html += '</div></div>';
                }
                else if (q.type === 'sentence_rewrite') {
                    html += '<textarea class="rewrite-input" id="input-' + q.id + '" placeholder="Nhập câu trả lời của bạn..."></textarea>';
                }
                
                html += '<button class="check-btn" id="check-btn-' + q.id + '" onclick="checkQuestion(' + q.id + ')">Kiểm tra</button>';
                html += '<div class="explanation" id="expl-' + q.id + '"></div>';
                
                block.innerHTML = html;
                container.appendChild(block);
            });
        }
        
        function startTest() {
            const nameInput = document.getElementById('studentName').value.trim();
            if (!nameInput) {
                alert('Vui lòng nhập họ và tên của bạn!');
                return;
            }
            studentName = nameInput;
            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('testScreen').classList.add('active');
            window.scrollTo(0, 0);
        }
        
        function moveChip(qid, tokenId) {
            if (state[qid].checked) return;
            const chip = document.getElementById('chip-' + qid + '-' + tokenId);
            const bank = document.getElementById('bank-' + qid);
            const drop = document.getElementById('drop-' + qid);
            if (chip.parentElement === bank) {
                drop.appendChild(chip);
            } else {
                bank.appendChild(chip);
            }
        }
        
        function checkQuestion(qid) {
            if (state[qid].checked) return;
            const q = quizData.find(x => x.id === qid);
            
            // Validate answered
            if (q.type === 'multiple_choice' || q.type === 'mcq') {
                const selected = document.querySelector('input[name="q-' + qid + '"]:checked');
                if (!selected) { alert("Vui lòng chọn một đáp án!"); return; }
            } else if (q.type === 'gap_fill_text') {
                let allFilled = true;
                q.blanks.forEach(b => {
                    if (!document.getElementById('input-' + qid + '-' + b.blankId).value.trim()) allFilled = false;
                });
                if (!allFilled) { alert("Vui lòng điền vào tất cả chỗ trống!"); return; }
            } else if (q.type === 'reordering') {
                const bank = document.getElementById('bank-' + qid);
                if (bank.children.length > 0) { alert("Vui lòng ghép tất cả các từ!"); return; }
            } else if (q.type === 'sentence_rewrite') {
                if (!document.getElementById('input-' + qid).value.trim()) { alert("Vui lòng nhập câu trả lời!"); return; }
            }
            
            // Check logic
            state[qid].checked = true;
            document.getElementById('check-btn-' + qid).disabled = true;
            const expl = document.getElementById('expl-' + qid);
            expl.innerHTML = q.explanationHTML || q.explanation || '';
            expl.style.display = 'block';
            
            let isCorrect = false;
            let errorDetails = "";
            
            if (q.type === 'multiple_choice' || q.type === 'mcq') {
                const selectedVal = document.querySelector('input[name="q-' + qid + '"]:checked').value;
                const correctOpt = q.options.find(o => o.isCorrect).label;
                isCorrect = (selectedVal === correctOpt);
                
                document.querySelectorAll('input[name="q-' + qid + '"]').forEach(el => el.disabled = true);
                
                if (isCorrect) {
                    document.getElementById('lbl-' + qid + '-' + selectedVal).classList.add('correct-opt');
                } else {
                    document.getElementById('lbl-' + qid + '-' + selectedVal).classList.add('wrong-opt');
                    document.getElementById('lbl-' + qid + '-' + correctOpt).classList.add('correct-opt');
                    errorDetails = 'Câu ' + qid + ': Học sinh chọn ' + selectedVal + ' (sai), đáp án đúng là ' + correctOpt;
                }
            } 
            else if (q.type === 'gap_fill_text') {
                let allCorrect = true;
                let userAnswersArr = [];
                let correctAnswersArr = [];
                
                q.blanks.forEach(b => {
                    const input = document.getElementById('input-' + qid + '-' + b.blankId);
                    const val = input.value.trim().toLowerCase();
                    input.disabled = true;
                    userAnswersArr.push(input.value.trim());
                    correctAnswersArr.push(b.correctAnswers[0]);
                    
                    const isMatch = b.correctAnswers.some(ans => ans.toLowerCase().trim() === val);
                    if (isMatch) {
                        input.classList.add('correct-input');
                    } else {
                        input.classList.add('wrong-input');
                        allCorrect = false;
                        let span = document.createElement('span');
                        span.className = 'correct-answer-text';
                        span.textContent = ' (' + b.correctAnswers[0] + ') ';
                        input.parentNode.insertBefore(span, input.nextSibling);
                    }
                });
                isCorrect = allCorrect;
                if (!isCorrect) {
                    errorDetails = 'Câu ' + qid + ': Học sinh điền "' + userAnswersArr.join(', ') + '" (sai), đáp án đúng là "' + correctAnswersArr.join(', ') + '"';
                }
            }
            else if (q.type === 'reordering') {
                const drop = document.getElementById('drop-' + qid);
                const chips = Array.from(drop.children);
                let userOrder = chips.map(c => c.getAttribute('data-token'));
                isCorrect = JSON.stringify(userOrder) === JSON.stringify(q.correctOrder);
                
                let userText = chips.map(c => c.textContent).join(' ');
                let corrText = q.correctOrder.map(tid => q.words.find(w => w.tokenId === tid).text).join(' ');
                
                if (isCorrect) {
                    drop.classList.add('correct-opt');
                } else {
                    drop.classList.add('wrong-opt');
                    let corrDiv = document.createElement('div');
                    corrDiv.style.marginTop = '10px';
                    corrDiv.style.color = '#e74c3c';
                    corrDiv.style.fontWeight = 'bold';
                    corrDiv.textContent = "Đáp án đúng: " + corrText;
                    drop.parentNode.appendChild(corrDiv);
                    errorDetails = 'Câu ' + qid + ': Học sinh ghép "' + userText + '" (sai), đáp án đúng là "' + corrText + '"';
                }
            }
            else if (q.type === 'sentence_rewrite') {
                const input = document.getElementById('input-' + qid);
                input.disabled = true;
                input.classList.add('wrong-opt'); 
                let corrDiv = document.createElement('div');
                corrDiv.style.marginTop = '10px';
                corrDiv.style.color = '#27ae60';
                corrDiv.style.fontWeight = 'bold';
                corrDiv.textContent = "Đáp án mẫu: " + q.sampleAnswers.join(" HOẶC ");
                input.parentNode.insertBefore(corrDiv, input.nextSibling);
                isCorrect = true; 
                state[qid].isRewrite = true;
            }
            
            state[qid].isCorrect = isCorrect;
            state[qid].errorDetails = errorDetails;
            updateProgress();
        }
        
        function updateProgress() {
            let checkedCount = 0;
            quizData.forEach(q => { if (state[q.id].checked) checkedCount++; });
            const pct = (checkedCount / quizData.length) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
        }
        
        function submitTest() {
            quizData.forEach(q => {
                if (!state[q.id].checked) {
                    state[q.id].checked = true;
                    state[q.id].isCorrect = false;
                    state[q.id].errorDetails = 'Câu ' + q.id + ': Bỏ trống';
                }
            });
            
            updateProgress();
            
            let score = 0;
            let gradableCount = 0;
            let errorList = [];
            
            quizData.forEach(q => {
                if (state[q.id].isRewrite) return;
                gradableCount++;
                if (state[q.id].isCorrect) score++;
                else if (state[q.id].errorDetails) errorList.push(state[q.id].errorDetails);
            });
            
            const scoreText = score + ' / ' + gradableCount;
            const errorDetailsStr = errorList.length > 0 ? errorList.join(' | ') : 'Không có lỗi sai';
            const formURL = 'https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse';
            
            const formData = new URLSearchParams();
            formData.append('entry.1861648410', studentName);
            formData.append('entry.1691800437', scoreText);
            formData.append('entry.639295732', errorDetailsStr);
            formData.append('entry.370465671', testName);
            
            fetch(formURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(() => {
                document.getElementById('testScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.add('active');
                document.getElementById('scoreDisplay').innerText = 'Điểm của bạn: ' + scoreText;
                window.scrollTo(0, 0);
            }).catch(err => {
                alert('Có lỗi khi gửi kết quả. Vui lòng thử lại!');
                console.error(err);
            });
        }
        
        init();
    </script>
</body>
</html>
