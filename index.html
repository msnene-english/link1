<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Quiz - Unit 1</title>
    <style>
        :root {
            --color-primary: #4F46E5;
            --color-secondary: #06B6D4;
            --color-accent: #F59E0B;
            --color-bg: #F8FAFC;
            --color-card: #FFFFFF;
            --color-correct: #22C55E;
            --color-wrong: #EF4444;
            --color-selecting: #2563EB;
            --color-pending: #FEF3C7;
            --color-pending-text: #92400E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--color-bg);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            color: #1e293b;
            line-height: 1.6;
        }

        header {
            background: var(--color-card);
            padding: 16px 20px;
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
            margin-bottom: 24px;
        }

        .progress-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--color-primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .card {
            background: var(--color-card);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,.12);
        }

        .question-title {
            font-size: 16px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 20px;
            overflow-wrap: break-word;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--color-selecting);
            background: #eff6ff;
        }

        .option-btn.selected {
            background: var(--color-pending);
            color: var(--color-pending-text);
            border-color: var(--color-accent);
            transform: scale(1.02);
        }

        .option-btn.correct {
            background: var(--color-correct);
            border-color: var(--color-correct);
            color: white;
        }

        .option-btn.wrong {
            background: var(--color-wrong);
            border-color: var(--color-wrong);
            color: white;
            animation: shake 0.3s;
        }

        .input-text {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        
        .input-text:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .input-text.correct {
            border-color: var(--color-correct);
            background: #dcfce7;
        }

        .input-text.wrong {
            border-color: var(--color-wrong);
            background: #fee2e2;
        }

        .inline-input {
            width: 120px;
            padding: 4px 8px;
            margin: 0 4px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 18px;
            text-align: center;
        }
        
        .inline-input.correct {
            border-color: var(--color-correct);
            background: #dcfce7;
        }

        .inline-input.wrong {
            border-color: var(--color-wrong);
            background: #fee2e2;
        }

        .btn-check {
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            min-height: 52px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-check:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .explanation {
            margin-top: 20px;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 17px;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        footer {
            text-align: center;
            padding: 20px;
        }

        .btn-submit {
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,.1);
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: scale(1.05);
        }

        #error-list {
            display: none;
            margin-top: 40px;
        }

        .error-card {
            background: #fff;
            border-left: 6px solid var(--color-wrong);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
        }

        .error-card.manual-review {
            border-left-color: var(--color-secondary);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 600px) {
            .question-text { font-size: 20px; }
            .option-btn { font-size: 17px; }
            .explanation { font-size: 16px; }
        }
        
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .popup h2 { margin-bottom: 15px; }
        .popup p { margin-bottom: 20px; font-size: 18px; }
        .popup button {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="progress-container">
            <h1 style="font-size: 22px; font-weight: 700;">English Grammar Quiz - Unit 1</h1>
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 15px; color: #64748b;">
                <span>Tiến độ</span>
                <span id="progress-text">0/46</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
    </header>

    <main id="quiz-container">
        <!-- Questions will be rendered here -->
    </main>

    <footer>
        <button id="btn-submit" class="btn-submit" onclick="submitQuiz()">Nộp bài</button>
    </footer>

    <div id="error-list" class="progress-container">
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 20px;">DANH SÁCH CÁC CÂU LÀM SAI</h2>
        <div id="errors-container"></div>
        <h2 style="font-size: 22px; font-weight: 700; margin: 40px 0 20px;">Các câu tự luận — hãy tự đối chiếu đáp án mẫu</h2>
        <div id="manual-review-container"></div>
    </div>

    <div class="overlay" id="result-popup">
        <div class="popup">
            <h2 id="popup-title">Kết quả</h2>
            <p id="popup-score"></p>
            <p id="popup-message"></p>
            <button onclick="closePopup()">Đóng & Xem chi tiết</button>
        </div>
    </div>

    <script>
        const quizData = [
            // Part A
            { id: 1, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> Elizabeth <b>usually goes</b> / <b>is usually going</b> to bed at around eleven o'clock.", options: [
                { label: "A", html: "usually goes", isCorrect: true },
                { label: "B", html: "is usually going", isCorrect: false }
            ], explanationHTML: "<b>Câu hỏi:</b> Elizabeth thường đi ngủ vào khoảng 11 giờ.<br><b>Giải thích:</b> 'usually' là trạng từ chỉ tần suất, dấu hiệu của thì hiện tại đơn để diễn tả thói quen. Vì vậy, ta dùng 'usually goes' (A). 'is usually going' (B) là thì hiện tại tiếp diễn, không phù hợp để chỉ thói quen thường xuyên." },
            { id: 2, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> Dan <b>talks</b> / <b>is talking</b> on the other phone right now.", options: [
                { label: "A", html: "talks", isCorrect: false },
                { label: "B", html: "is talking", isCorrect: true }
            ], explanationHTML: "<b>Câu hỏi:</b> Dan đang nói chuyện trên điện thoại khác ngay bây giờ.<br><b>Giải thích:</b> 'right now' là dấu hiệu của thì hiện tại tiếp diễn, diễn tả hành động đang xảy ra tại thời điểm nói. Vì vậy, ta dùng 'is talking' (B). 'talks' (A) là thì hiện tại đơn, không dùng cho hành động đang xảy ra ngay lúc này." },
            { id: 3, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> We <b>don't eat</b> / <b>aren't eating</b> any meat at the moment as we're both on a diet.", options: [
                { label: "A", html: "don't eat", isCorrect: false },
                { label: "B", html: "aren't eating", isCorrect: true }
            ], explanationHTML: "<b>Câu hỏi:</b> Chúng tôi hiện không ăn thịt vì cả hai đang ăn kiêng.<br><b>Giải thích:</b> 'at the moment' diễn tả một tình trạng tạm thời xung quanh thời điểm hiện tại. Do đó dùng thì hiện tại tiếp diễn 'aren't eating' (B). 'don't eat' (A) mang nghĩa thói quen cố định." },
            { id: 4, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> <b>Does air travel get</b> / <b>Is air travel getting</b> increasingly safe?", options: [
                { label: "A", html: "Does air travel get", isCorrect: false },
                { label: "B", html: "Is air travel getting", isCorrect: true }
            ], explanationHTML: "<b>Câu hỏi:</b> Đi lại bằng đường hàng không có đang ngày càng trở nên an toàn hơn không?<br><b>Giải thích:</b> 'increasingly' (ngày càng) đi kèm với động từ 'get' để diễn tả một sự thay đổi đang diễn ra, nên ta dùng thì hiện tại tiếp diễn 'Is air travel getting' (B)." },
            { id: 5, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> My mum <b>calls</b> / <b>is calling</b> me every weekend without fail.", options: [
                { label: "A", html: "calls", isCorrect: true },
                { label: "B", html: "is calling", isCorrect: false }
            ], explanationHTML: "<b>Câu hỏi:</b> Mẹ tôi gọi cho tôi mỗi cuối tuần không trượt phát nào.<br><b>Giải thích:</b> 'every weekend' chỉ một thói quen lặp đi lặp lại. Ta dùng thì hiện tại đơn 'calls' (A)." },
            { id: 6, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> How much <b>do babysitters generally earn</b> / <b>are babysitters generally earning</b>?", options: [
                { label: "A", html: "do babysitters generally earn", isCorrect: true },
                { label: "B", html: "are babysitters generally earning", isCorrect: false }
            ], explanationHTML: "<b>Câu hỏi:</b> Người trông trẻ thường kiếm được bao nhiêu tiền?<br><b>Giải thích:</b> 'generally' (thông thường) chỉ một sự thật chung chung hoặc thói quen. Ta dùng thì hiện tại đơn 'do babysitters generally earn' (A)." },
            { id: 7, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> <b>You always come</b> / <b>You're always coming</b> up with excuses for not having done your homework. It's so annoying!", options: [
                { label: "A", html: "You always come", isCorrect: false },
                { label: "B", "html": "You're always coming", isCorrect: true }
            ], explanationHTML: "<b>Câu hỏi:</b> Bạn luôn luôn tìm cớ cho việc không làm bài tập. Thật là bực mình!<br><b>Giải thích:</b> Cấu trúc 'always + V-ing' được dùng ở thì hiện tại tiếp diễn để phàn nàn về một thói quen xấu lặp đi lặp lại gây khó chịu ('It's so annoying!'). Vì vậy đáp án đúng là 'You're always coming' (B)." },
            { id: 8, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> <b>I don't go</b> / <b>I'm not going</b> out much during the week but <b>I always try</b> / <b>I'm always trying</b> to go out somewhere on Saturday night.", options: [
                { label: "A", html: "I don't go / I always try", isCorrect: true },
                { label: "B", html: "I'm not going / I'm always trying", isCorrect: false },
                { label: "C", html: "I don't go / I'm always trying", isCorrect: false },
                { label: "D", html: "I'm not going / I always try", isCorrect: false }
            ], explanationHTML: "<b>Câu hỏi:</b> Tôi không ra ngoài nhiều trong tuần nhưng tôi luôn cố gắng đi chơi đâu đó vào tối thứ Bảy.<br><b>Giải thích:</b> Cả hai vế đều diễn tả thói quen thông thường ('during the week', 'always'), nên dùng thì hiện tại đơn cho cả hai: 'I don't go' và 'I always try'." },
            { id: 9, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> No, the train <b>does stop</b> / <b>is stopping</b> at Cirencester on Saturdays.", options: [
                { label: "A", html: "does stop", isCorrect: true },
                { label: "B", html: "is stopping", isCorrect: false }
            ], explanationHTML: "<b>Câu hỏi:</b> Không, tàu có dừng ở Cirencester vào các ngày thứ Bảy.<br><b>Giải thích:</b> 'on Saturdays' chỉ lịch trình cố định. Ta dùng thì hiện tại đơn. Trợ động từ 'does' được thêm vào để nhấn mạnh ('does stop')." },
            { id: 10, type: "multiple_choice", questionHTML: "<b>Chọn đáp án đúng:</b> My mum <b>takes</b> / <b>is taking</b> part in ice-skating competitions almost every weekend.", options: [
                { label: "A", html: "takes", isCorrect: true },
                { label: "B", html: "is taking", isCorrect: false }
            ], explanationHTML: "<b>Câu hỏi:</b> Mẹ tôi tham gia các cuộc thi trượt băng nghệ thuật hầu như mỗi cuối tuần.<br><b>Giải thích:</b> 'almost every weekend' diễn tả một thói quen lặp lại thường xuyên, do đó dùng thì hiện tại đơn 'takes'." },

            // Part B
            { id: 11, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br>My dad <b>is often getting up</b> late on Saturday mornings.", originalSentenceHTML: "My dad <b>is often getting up</b> late on Saturday mornings.", sampleAnswers: ["often gets up"], explanationHTML: "<b>Giải thích:</b> 'often' chỉ tần suất thường xuyên, nên dùng thì hiện tại đơn: 'often gets up'." },
            { id: 12, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br><b>Are you speaking</b> any other languages apart from English?", originalSentenceHTML: "<b>Are you speaking</b> any other languages apart from English?", sampleAnswers: ["Do you speak"], explanationHTML: "<b>Giải thích:</b> Động từ 'speak' (nói một ngôn ngữ) chỉ một khả năng cố định, không phải hành động đang diễn ra. Dùng hiện tại đơn: 'Do you speak'." },
            { id: 13, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br><b>I already buy</b> all my Christmas presents and it's only October!", originalSentenceHTML: "<b>I already buy</b> all my Christmas presents and it's only October!", sampleAnswers: ["I have already bought", "I've already bought"], explanationHTML: "<b>Giải thích:</b> 'already' (đã... rồi) là dấu hiệu của thì hiện tại hoàn thành. Dùng 'I have already bought' hoặc 'I've already bought'." },
            { id: 14, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br>It's the first time <b>I'm ever having</b> a party at home.", originalSentenceHTML: "It's the first time <b>I'm ever having</b> a party at home.", sampleAnswers: ["I have ever had", "I've ever had"], explanationHTML: "<b>Giải thích:</b> Cấu trúc 'It is the first/second... time + S + have/has + V3/ed' (đây là lần đầu tiên/thứ hai...). Dùng hiện tại hoàn thành: 'I have ever had'." },
            { id: 15, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br>Actually, I think Darren <b>does works</b> quite hard sometimes.", originalSentenceHTML: "Actually, I think Darren <b>does works</b> quite hard sometimes.", sampleAnswers: ["does work"], explanationHTML: "<b>Giải thích:</b> Khi dùng trợ động từ 'does' để nhấn mạnh, động từ chính phải ở dạng nguyên thể. Do đó là 'does work'." },
            { id: 16, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br>Carlo <b>is never eating</b> Chinese food before.", originalSentenceHTML: "Carlo <b>is never eating</b> Chinese food before.", sampleAnswers: ["has never eaten"], explanationHTML: "<b>Giải thích:</b> 'before' ở cuối câu mang nghĩa cho đến nay, là dấu hiệu thì hiện tại hoàn thành. Dùng 'has never eaten'." },
            { id: 17, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br>Sean <b>already books</b> a table for tonight.", originalSentenceHTML: "Sean <b>already books</b> a table for tonight.", sampleAnswers: ["has already booked"], explanationHTML: "<b>Giải thích:</b> 'already' là dấu hiệu của thì hiện tại hoàn thành, chỉ hành động đã xảy ra. Dùng 'has already booked'." },
            { id: 18, type: "short_answer", questionHTML: "<b>Sửa lỗi sai:</b> Viết lại phần in đậm cho đúng.<br><b>Needs Melanie</b> any help painting her new flat?", originalSentenceHTML: "<b>Needs Melanie</b> any help painting her new flat?", sampleAnswers: ["Does Melanie need"], explanationHTML: "<b>Giải thích:</b> 'need' thường dùng như động từ thường, khi đặt câu hỏi cần mượn trợ động từ 'does' cho ngôi thứ 3 số ít. Dùng 'Does Melanie need'." },

            // Part C
            { id: 19, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> Điền dạng đúng của động từ trong ngoặc.<br>It's the first time {{blank:b1}} <b>(I / ever / eat)</b> octopus!", blanks: [{blankId: "b1", correctAnswers: ["I have ever eaten", "I've ever eaten"]}], explanationHTML: "<b>Giải thích:</b> Cấu trúc 'It's the first time' đi với thì hiện tại hoàn thành. Đáp án: 'I have ever eaten'." },
            { id: 20, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> Sandy {{blank:b1}} <b>(not / see)</b> his sister since she went to university.", blanks: [{blankId: "b1", correctAnswers: ["has not seen", "hasn't seen"]}], explanationHTML: "<b>Giải thích:</b> 'since she went' là dấu hiệu của hiện tại hoàn thành. Đáp án: 'has not seen'." },
            { id: 21, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> They {{blank:b1}} <b>(go)</b> on holiday to Spain and won't be back until the end of the month.", blanks: [{blankId: "b1", correctAnswers: ["have gone", "'ve gone"]}], explanationHTML: "<b>Giải thích:</b> Hành động đi nghỉ mát và chưa về ('won't be back'), dùng hiện tại hoàn thành 'have gone'." },
            { id: 22, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> Poor Tracy! She {{blank:b1}} <b>(write)</b> that essay for hours now and she still hasn't finished!", blanks: [{blankId: "b1", correctAnswers: ["has been writing", "'s been writing"]}], explanationHTML: "<b>Giải thích:</b> 'for hours now' và hành động vẫn chưa kết thúc ('still hasn't finished') nhấn mạnh quá trình liên tục. Dùng hiện tại hoàn thành tiếp diễn: 'has been writing'." },
            { id: 23, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> {{blank:b1}} <b>(you / ever / meet)</b> anyone famous?", blanks: [{blankId: "b1", correctAnswers: ["Have you ever met"]}], explanationHTML: "<b>Giải thích:</b> Hỏi về trải nghiệm với 'ever', dùng thì hiện tại hoàn thành. Đáp án: 'Have you ever met'." },
            { id: 24, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> {{blank:b1}} <b>(I / try)</b> to get in touch with Jenny all morning but I can't find her anywhere.", blanks: [{blankId: "b1", correctAnswers: ["I have been trying", "I've been trying"]}], explanationHTML: "<b>Giải thích:</b> 'all morning' nhấn mạnh tính liên tục của hành động từ quá khứ đến hiện tại, dùng thì hiện tại hoàn thành tiếp diễn. Đáp án: 'I have been trying'." },
            { id: 25, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> {{blank:b1}} <b>(I / not finish)</b> the book yet so I can't tell you what happens.", blanks: [{blankId: "b1", correctAnswers: ["I have not finished", "I haven't finished"]}], explanationHTML: "<b>Giải thích:</b> 'yet' dùng trong câu phủ định của thì hiện tại hoàn thành. Đáp án: 'I have not finished'." },
            { id: 26, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> {{blank:b1}} <b>(you / already / decide)</b> where you're going this summer?", blanks: [{blankId: "b1", correctAnswers: ["Have you already decided"]}], explanationHTML: "<b>Giải thích:</b> 'already' đi với thì hiện tại hoàn thành. Câu hỏi nghi vấn: 'Have you already decided'." },
            { id: 27, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> {{blank:b1}} <b>(We / live)</b> here for the last six years.", blanks: [{blankId: "b1", correctAnswers: ["We have lived", "We've lived", "We have been living", "We've been living"]}], explanationHTML: "<b>Giải thích:</b> 'for the last six years' có thể dùng hiện tại hoàn thành (nhấn mạnh kết quả) hoặc hiện tại hoàn thành tiếp diễn (nhấn mạnh tính liên tục). Cả hai đều được chấp nhận: 'We have lived' hoặc 'We have been living'." },
            { id: 28, type: "gap_fill_text", questionHTML: "<b>Chia động từ:</b> {{blank:b1}} <b>(I / never / hear)</b> such nonsense!", blanks: [{blankId: "b1", correctAnswers: ["I have never heard", "I've never heard"]}], explanationHTML: "<b>Giải thích:</b> 'never' mang nghĩa cho đến nay, dùng thì hiện tại hoàn thành. Đáp án: 'I have never heard'." },

            { id: 30, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>I haven't worked out how to set the timer on the video {{blank:b1}}.", blanks: [{blankId: "b1", correctAnswers: ["yet"]}], explanationHTML: "<b>Giải thích:</b> 'yet' đặt ở cuối câu phủ định của thì HTHT, mang nghĩa 'vẫn chưa'. Nghĩa: Tôi vẫn chưa tìm ra cách đặt hẹn giờ." },
            { id: 31, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>My dad's lived in the same house {{blank:b1}} he was born.", blanks: [{blankId: "b1", correctAnswers: ["since"]}], explanationHTML: "<b>Giải thích:</b> 'since + mốc thời gian/mệnh đề quá khứ' (từ khi). Nghĩa: Bố tôi sống ở cùng một ngôi nhà từ khi sinh ra." },
            { id: 32, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>The film's only been on {{blank:b1}} a couple of minutes.", blanks: [{blankId: "b1", correctAnswers: ["for"]}], explanationHTML: "<b>Giải thích:</b> 'for + khoảng thời gian'. Nghĩa: Bộ phim mới chiếu được vài phút." },
            { id: 33, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>Bruce has knocked three men out of the competition {{blank:b1}} far.", blanks: [{blankId: "b1", correctAnswers: ["so"]}], explanationHTML: "<b>Giải thích:</b> Cụm từ 'so far' (cho đến nay) là dấu hiệu HTHT. Nghĩa: Bruce đã loại 3 người khỏi cuộc thi cho đến nay." },
            { id: 34, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>I {{blank:b1}} get the chance to get any exercise - I'm just too busy.", blanks: [{blankId: "b1", correctAnswers: ["rarely"]}], explanationHTML: "<b>Giải thích:</b> 'rarely' (hiếm khi), chỉ tần suất. Nghĩa: Tôi hiếm khi có cơ hội tập thể dục - tôi quá bận." },
            { id: 35, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>He's only {{blank:b1}} got home.", blanks: [{blankId: "b1", correctAnswers: ["just"]}], explanationHTML: "<b>Giải thích:</b> 'just' đứng giữa trợ động từ và phân từ 2, chỉ hành động vừa mới xảy ra. Nghĩa: Anh ấy vừa mới về nhà." },
            { id: 36, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>It's eleven o'clock and Todd {{blank:b1}} hasn't come home. Where could he be?", blanks: [{blankId: "b1", correctAnswers: ["still"]}], explanationHTML: "<b>Giải thích:</b> 'still' đứng trước trợ động từ phủ định (hasn't) mang nghĩa 'vẫn chưa' với ý phàn nàn/bất ngờ. Nghĩa: Todd vẫn chưa về." },
            { id: 37, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>I've never met Ruth {{blank:b1}}. What's she like?", blanks: [{blankId: "b1", correctAnswers: ["before"]}], explanationHTML: "<b>Giải thích:</b> 'before' đứng cuối câu mang nghĩa 'trước đây'. Nghĩa: Tôi chưa từng gặp Ruth trước đây." },
            { id: 38, type: "gap_fill_text", questionHTML: "<b>Điền từ:</b> Chọn từ trong hộp để điền vào chỗ trống: <i>already • before • ever • for • just • rarely • since • so • still • yet</i><br>Have you finished {{blank:b1}}? That was quick!", blanks: [{blankId: "b1", correctAnswers: ["already"]}], explanationHTML: "<b>Giải thích:</b> 'already' có thể đứng cuối câu hỏi để thể hiện sự ngạc nhiên khi việc gì đó xong sớm hơn dự kiến. Nghĩa: Bạn xong rồi cơ á? Nhanh thế!" },

            { id: 42, type: "multiple_choice", questionHTML: "<b>Trắc nghiệm ABCD:</b> ............ TV for the last four hours? Turn it off and get some exercise!", options: [

            { id: 43, type: "multiple_choice", questionHTML: "<b>Trắc nghiệm ABCD:</b> Eric, ............ hockey competitively or just for fun?", options: [

            { id: 44, type: "multiple_choice", questionHTML: "<b>Trắc nghiệm ABCD:</b> That's the first time ............ an answer right today!", options: [

            { id: 46, type: "multiple_choice", questionHTML: "<b>Trắc nghiệm ABCD:</b> Dan ............ in the living room while we redecorate his bedroom.", options: [

            { id: 47, type: "multiple_choice", questionHTML: "<b>Trắc nghiệm ABCD:</b> Unfortunately, Simone ............ a day off very often.", options: [

            { id: 48, type: "multiple_choice", questionHTML: "<b>Trắc nghiệm ABCD:</b> Actually, I ............ a cup of tea first thing every morning but then I switch to coffee.", options: [

        ];

        let userState = {};
        const stateLabels = ['A','B','C','D'];
        let hasShuffled = false;

        // Custom requirements: shuffle data true options uniformly
        function shuffleQuizData() {
            quizData.forEach(q => {
                if(q.type === 'multiple_choice') {
                    // Randomize options array
                    for (let i = q.options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                    }
                    // Reassign originalLabel
                    q.options.forEach((opt, idx) => {
                        opt.label = stateLabels[idx];
                    });
                }
            });
        }
        
        if (!hasShuffled) {
            shuffleQuizData();
            hasShuffled = true;
        }

        // Initialize state
        quizData.forEach(q => {
            if (q.type === 'gap_fill_text') {
                const bAns = {};
                q.blanks.forEach(b => bAns[b.blankId] = null);
                userState[q.id] = { answer: bAns, checked: false, isCorrect: null, blankResults: {} };
            } else {
                userState[q.id] = { answer: null, checked: false, isCorrect: null, blankResults: null };
            }
        });

        const escapeHTML = str => {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        };
        const normalizeAnswer = str => str.trim().replace(/\s+/g, ' ').toLowerCase();

        // Audio System
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSelectSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = 600;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e){}
        }
        function playCorrectSound() {
            try {
                initAudio();
                const t = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
                osc1.frequency.value = 800; gain1.gain.value = 0.2;
                osc1.connect(gain1); gain1.connect(audioCtx.destination);
                osc1.start(t); osc1.stop(t + 0.1);
                const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
                osc2.frequency.value = 1200; gain2.gain.value = 0.2;
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.start(t + 0.1); gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
                osc2.stop(t + 0.25);
            } catch(e){}
        }
        function playWrongSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.value = 150;
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } catch(e){}
        }
        function playSubmitSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.value = 500;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } catch(e){}
        }

        function updateProgress() {
            let done = 0;
            quizData.forEach(q => {
                const s = userState[q.id];
                if (q.type === 'multiple_choice' && s.answer) done++;
                if (q.type === 'short_answer' && s.answer) done++;
                if (q.type === 'gap_fill_text') {
                    const allFilled = Object.values(s.answer).every(v => v && v.trim().length > 0);
                    if (allFilled) done++;
                }
            });
            const tot = quizData.length;
            document.getElementById('progress-text').textContent = `${done}/${tot}`;
            document.getElementById('progress-bar').style.width = `${(done/tot)*100}%`;
        }

        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            quizData.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${q.id}`;
                
                let inner = `<div class="question-title">Câu ${idx + 1}</div>`;
                
                if (q.type === 'multiple_choice') {
                    inner += `<div class="question-text">${q.questionHTML}</div><div class="options-grid">`;
                    q.options.forEach(opt => {
                        inner += `<button class="option-btn" id="opt-${q.id}-${opt.label}" onclick="handleMCOption(${q.id}, '${opt.label}')">
                            <span style="font-weight:700;margin-right:12px;">${opt.label}.</span> ${opt.html}
                        </button>`;
                    });
                    inner += `</div>`;
                } else if (q.type === 'short_answer') {
                    inner += `<div class="question-text">${q.questionHTML}</div>
                    <input type="text" class="input-text" id="input-${q.id}" onchange="handleTextChange(${q.id}, this.value)" onfocus="initAudio()">`;
                } else if (q.type === 'gap_fill_text') {
                    let text = q.questionHTML;
                    q.blanks.forEach(b => {
                        text = text.replace(`{{blank:${b.blankId}}}`, `<input type="text" class="inline-input" id="input-${q.id}-${b.blankId}" onchange="handleGapFillChange(${q.id}, '${b.blankId}', this.value)" onfocus="initAudio()">`);
                    });
                    inner += `<div class="question-text" style="line-height:2.2">${text}</div>`;
                }
                
                inner += `<button class="btn-check" id="check-btn-${q.id}" onclick="checkAnswer(${q.id})" disabled>Kiểm tra</button>`;
                inner += `<div class="explanation" id="expl-${q.id}">${q.explanationHTML}</div>`;
                card.innerHTML = inner;
                container.appendChild(card);
            });
        }

        function handleMCOption(qId, label) {
            const s = userState[qId];
            if (s.checked) return;
            s.answer = label;
            document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el => el.classList.remove('selected'));
            document.getElementById(`opt-${qId}-${label}`).classList.add('selected');
            playSelectSound();
            document.getElementById(`check-btn-${qId}`).disabled = false;
            updateProgress();
        }

        function handleTextChange(qId, val) {
            const s = userState[qId];
            if (s.checked) return;
            s.answer = val;
            if(val.trim()!=='') playSelectSound();
            document.getElementById(`check-btn-${qId}`).disabled = (val.trim() === '');
            updateProgress();
        }

        function handleGapFillChange(qId, blankId, val) {
            const s = userState[qId];
            if (s.checked) return;
            s.answer[blankId] = val;
            if(val.trim()!=='') playSelectSound();
            
            const q = quizData.find(x => x.id === qId);
            const allFilled = q.blanks.every(b => s.answer[b.blankId] && s.answer[b.blankId].trim() !== '');
            document.getElementById(`check-btn-${qId}`).disabled = !allFilled;
            updateProgress();
        }

        function checkAnswer(qId) {
            const q = quizData.find(x => x.id === qId);
            const s = userState[qId];
            if (s.checked) return;

            s.checked = true;
            document.getElementById(`check-btn-${qId}`).disabled = true;
            
            // Lock inputs
            const card = document.getElementById(`card-${qId}`);
            card.style.pointerEvents = 'none';

            if (q.type === 'multiple_choice') {
                const correctOpt = q.options.find(o => o.isCorrect).label;
                if (s.answer === correctOpt) {
                    s.isCorrect = true;
                    document.getElementById(`opt-${qId}-${s.answer}`).classList.remove('selected');
                    document.getElementById(`opt-${qId}-${s.answer}`).classList.add('correct');
                    playCorrectSound();
                } else {
                    s.isCorrect = false;
                    document.getElementById(`opt-${qId}-${s.answer}`).classList.remove('selected');
                    document.getElementById(`opt-${qId}-${s.answer}`).classList.add('wrong');
                    document.getElementById(`opt-${qId}-${correctOpt}`).classList.add('correct');
                    playWrongSound();
                }
            } else if (q.type === 'short_answer') {
                s.isCorrect = null;
                // neutral ui
            } else if (q.type === 'gap_fill_text') {
                let allRight = true;
                q.blanks.forEach(b => {
                    const ans = s.answer[b.blankId] || '';
                    const isRight = b.correctAnswers.map(normalizeAnswer).includes(normalizeAnswer(ans));
                    s.blankResults[b.blankId] = isRight;
                    if (!isRight) allRight = false;
                    
                    const inp = document.getElementById(`input-${qId}-${b.blankId}`);
                    inp.classList.add(isRight ? 'correct' : 'wrong');
                    
                    if (!isRight) {
                        const span = document.createElement('span');
                        span.innerHTML = ` <strong style="color:var(--color-correct)">(${escapeHTML(b.correctAnswers[0])})</strong>`;
                        inp.parentNode.insertBefore(span, inp.nextSibling);
                    }
                });
                s.isCorrect = allRight;
                if(allRight) playCorrectSound(); else playWrongSound();
            }

            document.getElementById(`expl-${qId}`).classList.add('show');
        }

        function submitQuiz() {
            document.getElementById('btn-submit').disabled = true;
            
            // Auto check unchecked ones
            quizData.forEach(q => {
                const s = userState[q.id];
                if (!s.checked) {
                    s.checked = true;
                    if(q.type === 'short_answer') {
                        s.isCorrect = null;
                    } else if(q.type === 'multiple_choice') {
                        s.isCorrect = false;
                    } else if (q.type === 'gap_fill_text') {
                        s.isCorrect = false;
                        q.blanks.forEach(b => s.blankResults[b.blankId] = false);
                    }
                }
            });

            let gradable = 0;
            let correct = 0;
            let mistakesText = [];

            quizData.forEach(q => {
                const s = userState[q.id];
                if (s.isCorrect !== null) {
                    gradable++;
                    if (s.isCorrect) correct++;
                    else {
                        // generate mistake string
                        let m = `Câu ${q.id}: `;
                        if(q.type==='multiple_choice') {
                            const rightAns = q.options.find(o=>o.isCorrect);
                            const userLabel = s.answer || "(không chọn)";
                            const userAns = q.options.find(o=>o.label === s.answer);
                            m += `Học sinh chọn ${userLabel} - ${userAns?userAns.html:''} (sai), đáp án đúng là ${rightAns.label} - ${rightAns.html}`;
                        } else if(q.type==='gap_fill_text') {
                            m += `Học sinh điền: ` + JSON.stringify(s.answer) + ` (sai), đáp án đúng là: ` + JSON.stringify(q.blanks.map(b=>b.correctAnswers[0]));
                        }
                        mistakesText.push(m);
                    }
                }
            });

            playSubmitSound();
            if(gradable > 0 && correct === gradable) playCorrectSound();

            const scoreText = gradable > 0 ? `${correct}/${gradable}` : "Bài này không có câu được chấm tự động.";
            document.getElementById('popup-score').textContent = `Điểm: ${scoreText}`;
            document.getElementById('result-popup').style.display = 'flex';

            renderErrorList();
            
            // Send form
            const studentName = new URLSearchParams(window.location.search).get("name") || "Tên Học Sinh Ẩn Danh";
            const formData = new URLSearchParams();
            formData.append("entry.1861648410", studentName);
            formData.append("entry.1691800437", scoreText);
            formData.append("entry.639295732", mistakesText.join("\n"));
            formData.append("entry.370465671", "Unit 1 Grammar");
            
            fetch("https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse", {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            }).catch(e => console.log(e));
        }

        function closePopup() {
            document.getElementById('result-popup').style.display = 'none';
            document.getElementById('error-list').style.display = 'block';
            window.scrollTo({ top: document.getElementById('error-list').offsetTop, behavior: 'smooth' });
        }

        function renderErrorList() {
            const errCont = document.getElementById('errors-container');
            const manCont = document.getElementById('manual-review-container');
            errCont.innerHTML = ''; manCont.innerHTML = '';

            let hasErrors = false;

            quizData.forEach((q, idx) => {
                const s = userState[q.id];
                if (s.isCorrect === false) {
                    hasErrors = true;
                    const el = document.createElement('div');
                    el.className = 'error-card';
                    let h = `<strong>${idx+1}. </strong> ${q.questionHTML}<br><br>`;
                    
                    if (q.type === 'multiple_choice') {
                        q.options.forEach(opt => {
                            if (opt.isCorrect) h += `<div style="color:var(--color-correct)">✓ ${opt.label}. ${opt.html}</div>`;
                            else if (opt.label === s.answer) h += `<div style="color:var(--color-wrong);text-decoration:line-through">✕ ${opt.label}. ${opt.html}</div>`;
                            else h += `<div>${opt.label}. ${opt.html}</div>`;
                        });
                        if(!s.answer) h += `<div style="color:var(--color-wrong); font-style:italic;">(Bạn chưa chọn đáp án)</div>`;
                    } else if (q.type === 'gap_fill_text') {
                        let text = q.questionHTML;
                        q.blanks.forEach(b => {
                            const u = escapeHTML(s.answer[b.blankId] || '');
                            const c = escapeHTML(b.correctAnswers[0]);
                            if (s.blankResults[b.blankId]) {
                                text = text.replace(`{{blank:${b.blankId}}}`, `<span style="color:var(--color-correct)">${u}</span>`);
                            } else {
                                if (u) {
                                    text = text.replace(`{{blank:${b.blankId}}}`, `<span style="color:var(--color-wrong);text-decoration:line-through">${u}</span> <span style="color:var(--color-correct)">(${c})</span>`);
                                } else {
                                    text = text.replace(`{{blank:${b.blankId}}}`, `<span style="color:var(--color-correct)">(${c})</span>`);
                                }
                            }
                        });
                        h += text;
                        if(Object.values(s.answer).every(v=>!v)) h+= `<br><div style="color:var(--color-wrong); font-style:italic;">(Bạn chưa làm)</div>`;
                    }
                    
                    h += `<div class="explanation show" style="margin-top:15px">${q.explanationHTML}</div>`;
                    el.innerHTML = h;
                    errCont.appendChild(el);
                } else if (s.isCorrect === null) { // manual review
                    const el = document.createElement('div');
                    el.className = 'error-card manual-review';
                    let h = `<strong>${idx+1}. </strong> ${q.questionHTML}<br><br>`;
                    h += `<strong>Câu trả lời của bạn:</strong> ${s.answer ? escapeHTML(s.answer) : '<i style="color:var(--color-wrong)">(Bạn chưa viết câu trả lời)</i>'}<br>`;
                    h += `<strong>Đáp án mẫu:</strong> ${q.sampleAnswers.join(' / ')}<br>`;
                    h += `<div class="explanation show" style="margin-top:15px">${q.explanationHTML}</div>`;
                    el.innerHTML = h;
                    manCont.appendChild(el);
                }
            });

            if (!hasErrors) {
                errCont.innerHTML = '<div style="color:var(--color-correct); font-size:20px; font-weight:700; text-align:center; padding:20px;">🎉 Chúc mừng! Bạn đã trả lời đúng tất cả các câu trắc nghiệm!</div>';
            }
        }

        renderQuestions();
    </script>
</body>
